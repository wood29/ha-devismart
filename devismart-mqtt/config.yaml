# https://developers.home-assistant.io/docs/apps/configuration
name: DEVIreg Smart MQTT
version: "1.0.2"
slug: devismart-mqtt
description: DEVIreg Smart floor-heating thermostats in Home Assistant, via MQTT
url: "https://github.com/wood29/ha-devismart"
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto
services:
  - mqtt:need
map:
  - addon_config:rw
options:
  host: core-mosquitto
  port: 1883
  user: ""
  password: ""
  pairing_code: ""
  pairing_name: Home Assistant
  log_level: info
schema:
  host: str
  port: port
  user: str
  password: password
  pairing_code: str?
  pairing_name: str
  log_level: list(trace|debug|info|warning|error)
